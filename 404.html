<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>LockScreenStudio PRO</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      .container {
        text-align: center;
        background: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      }
      h1 { color: #333; margin: 0 0 10px 0; }
      p { color: #666; margin: 0 0 20px 0; }
      a {
        display: inline-block;
        padding: 10px 20px;
        background: #667eea;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        transition: background 0.3s;
      }
      a:hover { background: #764ba2; }
    </style>
    <script type="text/javascript">
      // Check if this is a real 404 or a SPA route
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var path = l.pathname;
      
      // Only redirect if pathname doesn't end with 404.html
      if (!path.includes('404.html')) {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body>
    <div class="container">
      <h1>404 - Page Not Found</h1>
      <p>Sorry, the page you are looking for doesn't exist.</p>
      <p>It may have been moved or deleted.</p>
      <a href="/">Go Home</a>
    </div>
  </body>
</html>
